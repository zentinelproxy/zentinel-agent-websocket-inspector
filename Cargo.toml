[package]
name = "zentinel-agent-websocket-inspector"
version = "0.5.0"
edition = "2021"
authors = ["Zentinel Core Team"]
description = "WebSocket inspection agent for Zentinel proxy"
license = "Apache-2.0"
repository = "https://github.com/zentinelproxy/zentinel-agent-websocket-inspector"
keywords = ["zentinel", "websocket", "security", "proxy", "agent"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "zentinel-websocket-inspector-agent"
path = "src/main.rs"

[lib]
name = "zentinel_agent_websocket_inspector"
path = "src/lib.rs"

[dependencies]
zentinel-agent-protocol = "0.6"
tokio = { version = "1", features = ["full", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
jsonschema = "0.18"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
